<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Strategy Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial/dist/chartjs-chart-financial.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chart-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; padding: 1rem; backdrop-filter: blur(4px); }
        .toolkit-item { cursor: grab; }
        .toolkit-item:active { cursor: grabbing; }
        .workspace-item { position: absolute; transition: box-shadow 0.2s; user-select: none; touch-action: none; min-width: 240px; }
        .workspace-item:hover { box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.7); }
        .indicator-drop-target { background-color: rgba(6, 182, 212, 0.2); border: 1px dashed #06b6d4; }
        .ws-item-header { cursor: move; }
        .tooltip { position: relative; display: inline-block; }
        .tooltip .tooltiptext { visibility: hidden; background-color: #1f2937; color: #fff; text-align: left; border-radius: 6px; padding: 8px 12px; position: absolute; z-index: 1; bottom: 110%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; width: max-content; font-size: 12px; pointer-events: none; }
        .ws-item-header:hover .tooltiptext { visibility: visible; opacity: 1; }
        .socket { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #52525b; cursor: pointer; position: absolute; top: 50%; transform: translateY(-50%); transition: all 0.2s ease; }
        .socket:hover, .socket.highlight { border-color: #a78bfa; transform: translateY(-50%) scale(1.2); }
        .socket.input { background-color: #ec4899; left: -8px; }
        .socket.output { background-color: #22d3ee; right: -8px; }
        .stat-value { font-size: var(--stat-font-size, 0.8rem); transition: font-size 0.2s; }
        .resizer-x { flex-shrink: 0; cursor: ew-resize; width: 5px; background-color: #1f2937; transition: background-color 0.2s; }
        .resizer-x:hover { background-color: #06b6d4; }
        .resizer-y { flex-shrink: 0; cursor: ns-resize; height: 5px; background-color: #1f2937; transition: background-color 0.2s; }
        .resizer-y:hover { background-color: #06b6d4; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 overflow-hidden h-screen">
    <div class="flex h-full">
        <!-- Left Panel -->
        <div id="left-panel" class="h-full bg-gray-800 p-4 flex flex-col shadow-2xl flex-shrink-0" style="width: 20%; min-width: 250px;">
            <div class="flex items-center space-x-3 pb-4 border-b border-gray-700">
                <i data-lucide="shapes" class="w-8 h-8 text-cyan-400"></i><h1 class="text-xl font-bold text-white">Toolkit</h1>
            </div>
            <div id="toolkit" class="flex-grow overflow-y-auto space-y-1 pt-4"></div>
            <div class="border-t border-gray-700 pt-4">
                <h3 class="text-sm font-semibold text-gray-400 mb-2 px-2">Templates</h3>
                <div id="templates-container" class="space-y-2">
                    <select id="template-select" class="block w-full bg-gray-700 border border-gray-600 rounded-md py-2 px-3 text-white"></select>
                    <div class="grid grid-cols-3 gap-2 mt-2">
                        <button id="load-template-btn" class="w-full py-2 px-2 rounded-md text-sm font-medium text-white bg-cyan-600 hover:bg-cyan-700">Load</button>
                        <button id="import-template-btn" class="w-full py-2 px-2 rounded-md text-sm font-medium text-white bg-gray-600 hover:bg-gray-700">Import</button>
                        <button id="export-template-btn" class="w-full py-2 px-2 rounded-md text-sm font-medium text-white bg-gray-600 hover:bg-gray-700">Export</button>
                        <input type="file" id="import-template-input" class="hidden" accept=".json">
                    </div>
                </div>
            </div>
            <div class="border-t border-gray-700 pt-4 mt-auto">
                <label for="csv-file" class="block text-sm font-medium text-gray-400">Load Data</label>
                <input type="file" id="csv-file" accept=".csv" class="mt-1 block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:font-semibold file:bg-gray-600 file:text-white hover:file:bg-gray-500 cursor-pointer">
                <p id="data-status" class="text-xs text-gray-500 mt-2">Loading initial sample data...</p>
                <button id="run-backtest" class="w-full mt-4 py-2 px-4 rounded-md text-sm font-medium text-white bg-green-600 hover:bg-green-700">Run Backtest</button>
            </div>
        </div>
        <div id="left-resizer" class="resizer-x"></div>
        <!-- Workspace Panel -->
        <div id="workspace-container" class="h-full bg-gray-900 p-4 flex flex-col flex-grow">
            <div class="flex justify-between items-center pb-2">
                <h2 class="text-xl font-bold text-white">Workspace</h2>
                <div class="flex items-center space-x-2">
                      <button id="optimize-btn" class="p-1.5 bg-purple-600 text-white rounded-md hover:bg-purple-500 tooltip"><i data-lucide="wand-2" class="w-4 h-4"></i><span class="tooltiptext !bottom-full !top-auto !mb-2">Optimize Strategy</span></button>
                      <button id="save-template-btn" class="p-1.5 bg-gray-700 rounded-md hover:bg-gray-600 tooltip"><i data-lucide="save" class="w-4 h-4"></i><span class="tooltiptext !bottom-full !top-auto !mb-2">Save Workspace as Template</span></button>
                      <button id="auto-layout-btn" class="p-1.5 bg-gray-700 rounded-md hover:bg-gray-600 tooltip"><i data-lucide="layout-grid" class="w-4 h-4"></i><span class="tooltiptext !bottom-full !top-auto !mb-2">Auto Layout</span></button>
                </div>
            </div>
            <div id="workspace" class="flex-grow bg-gray-800/50 rounded-lg relative overflow-auto border border-gray-700">
                <svg id="connector-svg" class="absolute top-0 left-0 w-full h-full pointer-events-none"></svg>
                <div id="workspace-placeholder" class="text-center text-gray-500 h-full flex items-center justify-center pointer-events-none">Drag items to build your system.</div>
            </div>
        </div>
        <div id="right-resizer" class="resizer-x"></div>
        <!-- Right Panel -->
        <div id="right-panel" class="h-full bg-gray-800 p-4 flex flex-col flex-shrink-0" style="width: 20%; min-width: 250px;">
            <div id="stats-panel" class="flex-shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-sm font-semibold text-gray-400">Performance</h3>
                    <div class="flex items-center space-x-1">
                        <button id="font-size-down" class="p-0.5 bg-gray-700 rounded hover:bg-gray-600"><i data-lucide="minus" class="w-3 h-3"></i></button>
                        <button id="font-size-up" class="p-0.5 bg-gray-700 rounded hover:bg-gray-600"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        <button id="toggle-stats" class="p-0.5 bg-gray-700 rounded hover:bg-gray-600"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <div id="stats-grid" class="grid grid-cols-2 gap-1 transition-all duration-300">
                    <div class="bg-gray-900 p-1 rounded-lg text-center"><h4 class="text-xs text-gray-400">P/L</h4><p id="pnl" class="stat-value font-bold text-white">-</p></div>
                    <div class="bg-gray-900 p-1 rounded-lg text-center"><h4 class="text-xs text-gray-400">Win Rate</h4><p id="winrate" class="stat-value font-bold text-white">-</p></div>
                    <div class="bg-gray-900 p-1 rounded-lg text-center"><h4 class="text-xs text-gray-400">Trades</h4><p id="trades" class="stat-value font-bold text-white">-</p></div>
                    <div class="bg-gray-900 p-1 rounded-lg text-center"><h4 class="text-xs text-gray-400">Profit Factor</h4><p id="profit-factor" class="stat-value font-bold text-white">-</p></div>
                    <div class="bg-gray-900 p-1 rounded-lg text-center"><h4 class="text-xs text-gray-400">Max DD</h4><p id="max-drawdown" class="stat-value font-bold text-white">-</p></div>
                    <div class="bg-gray-900 p-1 rounded-lg text-center"><h4 class="text-xs text-gray-400">Sharpe</h4><p id="sharpe-ratio" class="stat-value font-bold text-white">-</p></div>
                    <div class="bg-gray-900 p-1 rounded-lg text-center col-span-2"><h4 class="text-xs text-gray-400">Avg W/L</h4><p id="avg-win-loss" class="stat-value font-bold text-white">-</p></div>
                </div>
            </div>
            <div class="flex-grow flex flex-col min-h-0 space-y-2 mt-2">
                <div id="chart-container" class="flex-grow bg-gray-900 rounded-lg shadow relative group min-h-0">
                    <canvas id="backtestChart"></canvas>
                    <canvas id="equityChart" class="hidden"></canvas>
                    <div class="absolute top-2 left-2 flex items-center space-x-2 z-10">
                         <div id="chart-type-toggle-main" class="flex space-x-1 bg-gray-900/50 p-1 rounded-md"></div>
                         <div id="price-chart-type-toggle" class="flex space-x-1 bg-gray-900/50 p-1 rounded-md"></div>
                    </div>
                    <div class="absolute bottom-2 right-2 flex items-center space-x-2">
                         <button id="reset-chart-btn" class="p-1.5 bg-gray-700/50 rounded-md hover:bg-gray-600 text-gray-400"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                         <button id="toggle-trades-btn" class="p-1.5 bg-gray-700/50 rounded-md hover:bg-gray-600 text-gray-400"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
                         <button id="expand-chart-btn" class="p-1.5 bg-gray-700/50 rounded-md hover:bg-gray-600"><i data-lucide="expand" class="w-4 h-4"></i></button>
                    </div>
                </div>
                <div id="v-resizer" class="resizer-y"></div>
                <div id="trade-log-panel" class="flex-shrink-0 flex flex-col min-h-[100px]">
                    <div class="flex justify-between items-center mb-1">
                        <h3 class="text-sm font-semibold text-gray-400">Trade Log</h3>
                        <button id="export-history-btn" class="p-1 bg-gray-700 rounded-md hover:bg-gray-600 tooltip"><i data-lucide="download" class="w-3 h-3"></i><span class="tooltiptext !bottom-full !top-auto !mb-2">Export History</span></button>
                    </div>
                    <div id="trade-log-container" class="flex-grow overflow-y-auto bg-gray-900 rounded-lg text-xs p-2">
                          <p class="text-gray-500">No trades to display.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modals -->
    <div id="chart-modal" class="bg-gray-900 bg-opacity-80 chart-modal hidden">
        <div class="w-full h-full bg-gray-800 rounded-lg shadow-xl p-4 flex flex-col relative">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-bold text-white">Backtest Chart</h3>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <label for="trade-count-select" class="text-xs text-gray-400">Trades:</label>
                        <select id="trade-count-select" class="bg-gray-900 text-xs rounded-md p-1 border border-gray-700">
                            <option value="20">Last 20</option><option value="50">Last 50</option><option value="100">Last 100</option><option value="all">All</option>
                        </select>
                    </div>
                   <div id="chart-type-toggle-modal" class="flex space-x-1 bg-gray-900 p-1 rounded-md z-20"></div>
                    <button id="toggle-trades-modal-btn" class="p-1.5 bg-gray-700 rounded-md hover:bg-gray-600 text-gray-400"><i data-lucide="eye-off" class="w-4 h-4"></i></button>
                   <button id="close-chart-modal-btn" class="p-2 bg-gray-700 rounded-full hover:bg-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>
            <div id="modal-chart-info" class="flex-shrink-0 text-xs text-gray-400 p-2 bg-gray-900/50 rounded-md text-center">Hover over the chart to see candle details.</div>
            <div class="flex-grow relative mt-2"><canvas id="modalBacktestChart"></canvas></div>
        </div>
    </div>
     <div id="settings-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden items-center justify-center z-50">
          <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-lg">
              <div class="flex justify-between items-center mb-4">
                  <h3 id="settings-modal-title" class="text-lg font-bold text-white">Settings</h3>
                  <button id="close-settings-modal-btn" class="p-1 rounded-full hover:bg-gray-700"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="settings-modal-body" class="space-y-2 max-h-[60vh] overflow-y-auto"></div>
            <div id="settings-modal-actions" class="mt-4"></div>
            <div class="mt-6 flex justify-end">
                <button id="save-settings-btn" class="py-2 px-4 rounded-md text-sm font-medium text-white bg-cyan-600 hover:bg-cyan-700">Save & Close</button>
            </div>
        </div>
    </div>

                                 <div><label for="pip-decimals-input" class="block text-sm font-medium text-gray-400">Pip Decimals</label><input type="number" id="pip-decimals-input" value="${node.pipDecimalPlaces || 4}" class="mt-1 block w-full bg-gray-900 border border-gray-600 rounded-md py-2 px-3 text-white"></div>
                                <div><label for="stop-loss-input" class="block text-sm font-medium text-gray-400">Stop Loss (pips)</label><input type="number" id="stop-loss-input" value="${node.stopLoss || 0}" class="mt-1 block w-full bg-gray-900 border border-gray-600 rounded-md py-2 px-3 text-white"><span class="text-xs text-gray-500">$${((node.stopLoss || 0) * pipValue * 100000 * (node.lotSize || 0.1)).toFixed(2)}</span></div>
                                 <div><label for="take-profit-input" class="block text-sm font-medium text-gray-400">Take Profit (pips)</label><input type="number" id="take-profit-input" value="${node.takeProfit || 0}" class="mt-1 block w-full bg-gray-900 border border-gray-600 rounded-md py-2 px-3 text-white"><span class="text-xs text-gray-500">$${((node.takeProfit || 0) * pipValue * 100000 * (node.lotSize || 0.1)).toFixed(2)}</span></div>
                                 <div><label for="cooldown-input" class="block text-sm font-medium text-gray-400">Cooldown (bars)</label><input type="number" id="cooldown-input" value="${node.tradeCooldown || 1}" class="mt-1 block w-full bg-gray-900 border border-gray-600 rounded-md py-2 px-3 text-white"></div>
                            </div>`;
                        DOMElements.settingsModalBody.innerHTML = (node.conditions.map((cond, index) => this.createConditionRow(node, cond, index)).join('') || '<p class="text-gray-400 text-sm">No conditions set.</p>') + riskManagementHTML;
                        DOMElements.settingsModalActions.innerHTML = `<button id="add-condition-btn" class="w-full py-2 px-4 text-xs rounded-md font-medium text-cyan-300 bg-cyan-900/50 hover:bg-cyan-900/80 border border-dashed border-cyan-700">Add Condition</button>`;
                        document.getElementById('add-condition-btn').onclick = () => this.addCondition(nodeId);
                        this.attachConditionRowListeners(nodeId);
                    }
                    DOMElements.settingsModal.classList.add('flex');
                    DOMElements.settingsModal.classList.remove('hidden');
                    lucide.createIcons();
                } else {
                    DOMElements.settingsModal.classList.add('hidden');
                    DOMElements.settingsModal.classList.remove('flex');
                    this.activeSettings = null;
                }
            }
            attachConditionRowListeners(nodeId) {
                 DOMElements.settingsModalBody.querySelectorAll('.grid[data-index]').forEach(row => {
                     const index = parseInt(row.dataset.index);
                     row.querySelector('.remove-condition-btn').onclick = () => this.removeCondition(nodeId, index);
                     row.querySelector('.condition-a').onchange = (e) => this.handleConditionChange(e, nodeId, index, 'a');
                     row.querySelector('.condition-op').onchange = (e) => this.handleConditionChange(e, nodeId, index, 'op');
                     row.querySelector('.condition-trigger').onchange = (e) => this.handleConditionChange(e, nodeId, index, 'trigger');
                     const bSelect = row.querySelector('.condition-b');
                     const bInput = row.querySelector('.condition-b-value');
                     if (bSelect) bSelect.onchange = (e) => this.handleConditionChange(e, nodeId, index, 'b');
                     if (bInput) {
                         bInput.onchange = (e) => this.handleConditionChange(e, nodeId, index, 'b');
                         bInput.onblur = (e) => { if (e.target.value.trim() === '') this.handleConditionChange(e, nodeId, index, 'b.revert'); };
                     }
                 });
            }
            handleConditionChange(event, nodeId, index, part) {
                const node = workspace.nodes[nodeId];
                if (!node || !node.conditions[index]) return;
                const condition = node.conditions[index];
                const value = event.target.value;
                if (part === 'a') {
                    condition.a = value;
                    const bOptions = [...this.getIndicatorOutputs(node), { value: 'value', text: 'Value' }].filter(opt => opt.value !== condition.a);
                    if (!bOptions.some(opt => opt.value === condition.b)) {
                        condition.b = bOptions.find(o => o.value === 'close') ? 'close' : (bOptions[0]?.value || 'value');
                        condition.bValue = (condition.b === 'value') ? 0 : null;
                    }
                } else if (part === 'op') condition.op = value;
                else if (part === 'trigger') condition.trigger = value;
                else if (part === 'b' || part === 'b.revert') {
                    if (value === 'value') { condition.b = 'value'; condition.bValue = condition.bValue ?? 0; }
                    else if (event.target.type === 'number') { condition.b = 'value'; condition.bValue = parseFloat(value) || 0; }
                    else if (part === 'b.revert') { condition.b = 'close'; condition.bValue = null; }
                    else { condition.b = value; condition.bValue = null; }
                }
                const newRowHTML = this.createConditionRow(node, condition, index);
                const currentRowElement = DOMElements.settingsModalBody.querySelector(`[data-index="${index}"]`);
                if (currentRowElement) {
                    const activeElement = document.activeElement;
                    const wasInput = activeElement && activeElement.tagName === 'INPUT';
                    const activeElementClasses = activeElement ? Array.from(activeElement.classList) : [];
                    currentRowElement.outerHTML = newRowHTML;
                    const newRowElement = DOMElements.settingsModalBody.querySelector(`[data-index="${index}"]`);
                    this.attachConditionRowListeners(nodeId);
                    if (activeElementClasses.length > 0 && part !== 'b.revert') {
                       const selector = activeElementClasses.map(c => `.${c}`).join('');
                       const elementToFocus = newRowElement.querySelector(selector);
                       if(elementToFocus) {
                           elementToFocus.focus();
                           if(wasInput && elementToFocus.tagName === 'INPUT') elementToFocus.selectionStart = elementToFocus.selectionEnd = elementToFocus.value.length;
                       }
                    }
                }
            }
            addCondition(nodeId){
                const node = workspace.nodes[nodeId];
                node.conditions.push({ a: 'close', op: 'crosses_above', b: 'value', bValue: 0, trigger: 'buy' });
                this.showSettingsModal(true, nodeId);
            }
            removeCondition(nodeId, index) {
                const node = workspace.nodes[nodeId];
                if (node && node.conditions[index]) {
                    node.conditions.splice(index, 1);
                    this.showSettingsModal(true, nodeId);
                }
            }
            getIndicatorOutputs(node) {
                const outputs = [{ value: 'close', text: 'Price' }];
                Object.values(node.indicators).forEach(indi => {
                    const config = TOOLKIT_CONFIG.indicators[indi.key];
                    const paramsText = indi.params.map(p => p.value).join(',');
                    if (['ma', 'rsi', 'atr', 'psar'].includes(indi.key)) outputs.push({ value: indi.id, text: `${config.name} (${paramsText})` });
                    else if (indi.key === 'macd') {
                        outputs.push({ value: `${indi.id}.macd`, text: `${config.name} Line` }, { value: `${indi.id}.signal`, text: `${config.name} Signal` }, { value: `${indi.id}.hist`, text: `${config.name} Hist` });
                    } else if (indi.key === 'bbands') {
                        outputs.push({ value: `${indi.id}.upper`, text: `${config.name} Upper` }, { value: `${indi.id}.middle`, text: `${config.name} Middle` }, { value: `${indi.id}.lower`, text: `${config.name} Lower` });
                    } else if (indi.key === 'stoch') {
                        outputs.push({ value: `${indi.id}.k`, text: `${config.name} %K` }, { value: `${indi.id}.d`, text: `${config.name} %D` });
                    } else if (indi.key === 'ichimoku') {
                        outputs.push({ value: `${indi.id}.tenkan`, text: `Tenkan` }, { value: `${indi.id}.kijun`, text: `Kijun` }, { value: `${indi.id}.senkouA`, text: `Senkou A` }, { value: `${indi.id}.senkouB`, text: `Senkou B` }, { value: `${indi.id}.chikou`, text: `Chikou` });
                    }
                });
                return outputs;
            }
            createConditionRow(node, condition, index) {
                const aOptions = this.getIndicatorOutputs(node);
                const bOptions = [...aOptions, { value: 'value', text: 'Value' }].filter(opt => opt.value !== condition.a);
                const createOptions = (options, selectedValue) => options.map(o => `<option value="${o.value}" ${o.value === selectedValue ? 'selected' : ''}>${o.text}</option>`).join('');
                let bContent = condition.b === 'value' ? `<input type="number" class="w-full bg-gray-700 p-2 rounded text-xs condition-b-value" value="${condition.bValue ?? ''}">` : `<select class="w-full bg-gray-700 p-2 rounded text-xs condition-b">${createOptions(bOptions, condition.b)}</select>`;
                return `<div class="grid grid-cols-12 gap-2 items-center" data-index="${index}">
                            <select class="col-span-2 bg-gray-700 p-2 rounded text-xs condition-trigger"><option value="buy" ${condition.trigger === 'buy' ? 'selected' : ''}>BUY</option><option value="sell" ${condition.trigger === 'sell' ? 'selected' : ''}>SELL</option></select>
                            <select class="col-span-4 bg-gray-700 p-2 rounded text-xs condition-a">${createOptions(aOptions, condition.a)}</select>
                            <select class="col-span-2 bg-gray-700 p-2 rounded text-xs condition-op"><option value="crosses_above" ${condition.op === 'crosses_above' ? 'selected' : ''}>> (cross)</option><option value="crosses_below" ${condition.op === 'crosses_below' ? 'selected' : ''}>< (cross)</option><option value="greater_than" ${condition.op === 'greater_than' ? 'selected' : ''}>>=</option><option value="less_than" ${condition.op === 'less_than' ? 'selected' : ''}><=</option></select>
                            <div class="col-span-3 condition-b-container">${bContent}</div><button class="col-span-1 text-red-500 remove-condition-btn"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                        </div>`;
            }
            generateStrategyTooltipContent(node) {
                if (!node || node.type !== 'strategy') return '';
                const allOutputs = this.getIndicatorOutputs(node);
                const getName = (id) => allOutputs.find(o => o.value === id)?.text || (id === 'value' ? 'Value' : 'N/A');
                const condsToHtml = (trigger) => node.conditions.filter(c => c.trigger === trigger).map(c => `<li>${getName(c.a)} ${c.op.replace('_', ' ')} ${c.b === 'value' ? c.bValue : getName(c.b)}</li>`).join('');
                const buyConditions = condsToHtml('buy'), sellConditions = condsToHtml('sell');
                let html = `<strong>Indicators:</strong> ${Object.values(node.indicators).map(i => TOOLKIT_CONFIG.indicators[i.key].name).join(', ') || 'None'}`;
                if (node.spread > 0) html += `<br><strong>Spread:</strong> ${node.spread} pips`;
                if (node.stopLoss > 0) html += `<br><strong>SL:</strong> ${node.stopLoss} pips`;
                if (node.takeProfit > 0) html += `<br><strong>TP:</strong> ${node.takeProfit} pips`;
                if(buyConditions) html += `<strong class="text-green-400 mt-2 block">BUY WHEN:</strong><ul class="list-disc list-inside">${buyConditions}</ul>`;
                if(sellConditions) html += `<strong class="text-red-400 mt-2 block">SELL WHEN:</strong><ul class="list-disc list-inside">${sellConditions}</ul>`;
                return html || 'No conditions set.';
            }
            saveSettings() {
                if(!this.activeSettings) return;
                const {nodeId, indiId, mode} = this.activeSettings;
                
                if (mode === 'save_template') {
                    const name = document.getElementById('template-name-input')?.value.trim();
                    if (name) { workspaceTemplates[name] = JSON.parse(JSON.stringify(workspace)); this.populateTemplateSelector(); DOMElements.templateSelect.value = name; }
                } else if (mode === 'export_template') {
                    const newName = document.getElementById('template-name-input')?.value.trim();
                    if (newName && workspaceTemplates[nodeId]) {
                         const templateToExport = { [newName]: workspaceTemplates[nodeId] };
                         const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(templateToExport, null, 2));
                         const a = document.createElement('a');
                         a.href = dataStr; a.download = `forex_architect_${newName.replace(/\s+/g, '_')}.json`; a.click();
                    }
                } else if(indiId){
                    const indicator = workspace.nodes[nodeId].indicators[indiId];
                    indicator.params.forEach(p => { p.value = parseFloat(document.getElementById(`param-${p.id}`).value) || p.value; });
                } else {
                    const node = workspace.nodes[nodeId];
                    if(node) {
                        node.lotSize = parseFloat(document.getElementById('lot-size-input').value) || 0.01;
                        node.spread = parseFloat(document.getElementById('spread-input').value) || 0;
                        node.stopLoss = parseFloat(document.getElementById('stop-loss-input').value) || 0;
                        node.takeProfit = parseFloat(document.getElementById('take-profit-input').value) || 0;
                        node.tradeCooldown = parseInt(document.getElementById('cooldown-input').value) || 1;
                        node.pipDecimalPlaces = parseInt(document.getElementById('pip-decimals-input').value) || 4;
                    }
                }
                
                this.renderWorkspace(); 
                this.showSettingsModal(false);
                if (mode !== 'save_template' && mode !== 'export_template') this.runBacktest();
            }
            calculateBacktestStats(tradeSignals, priceData, strategyNode) {
                 if (!priceData || priceData.length === 0) return { pnl: 0, winRate: 0, totalTrades: 0, profitFactor: 0, maxDrawdown: 0, sharpeRatio: 0, avgWin: 0, avgLoss: 0, maxWinStreak: 0, maxLossStreak: 0, equityData: [{ x: new Date().getTime(), y: 10000 }], tradeLog: [] };
                const initialEquity = 10000;
                const simulationResult = this._runSimulation(tradeSignals, priceData, strategyNode, initialEquity);
                const stats = this._calculatePerformanceStats(simulationResult.tradeLog, initialEquity, simulationResult.equityData);
                const result = { ...stats, equityData: simulationResult.equityData, totalTrades: tradeSignals.length, tradeLog: simulationResult.tradeLog };
                latestBacktestResult = result;
                return result;
            }
            _runSimulation(tradeSignals, priceData, strategyNode, initialEquity) {
                const pipDecimalPlaces = strategyNode?.pipDecimalPlaces || 4;
                const pipValue = Math.pow(10, -pipDecimalPlaces);
                const lotSize = strategyNode?.lotSize || 0.1;
                const lotMultiplier = 100000 * lotSize;
                const spreadInPips = strategyNode?.spread || 0;
                const spread = spreadInPips * pipValue;
                const stopLossPips = strategyNode?.stopLoss || 0;
                const takeProfitPips = strategyNode?.takeProfit || 0;
                const tradeCooldown = strategyNode?.tradeCooldown || 1;

                let equity = initialEquity;
                const equityData = [{ x: priceData[0].date.getTime(), y: initialEquity }];
                let peakEquity = initialEquity;
                let tradeLog = [];
                let barsSinceLastExit = Infinity;

                let currentPosition = null;
                const sortedSignals = tradeSignals.map(t => ({...t, date: t.entryDate.getTime()})).sort((a,b) => a.date - b.date);
                let signalIndex = 0;

                for(let i = 1; i < priceData.length; i++) {
                    barsSinceLastExit++;
                    const bar = priceData[i];
                    let exited = false;

                    if (currentPosition) {
                        let pnl = 0;
                        let exitPrice = 0;
                        if (currentPosition.direction === 'BUY') {
                            if (stopLossPips > 0 && bar.l <= currentPosition.stopLoss) { pnl = (currentPosition.stopLoss - currentPosition.entryPrice) * lotMultiplier; exitPrice = currentPosition.stopLoss; exited = true; }
                            else if (takeProfitPips > 0 && bar.h >= currentPosition.takeProfit) { pnl = (currentPosition.takeProfit - currentPosition.entryPrice) * lotMultiplier; exitPrice = currentPosition.takeProfit; exited = true; }
                        } else {
                            if (stopLossPips > 0 && bar.h >= currentPosition.stopLoss) { pnl = (currentPosition.entryPrice - currentPosition.stopLoss) * lotMultiplier; exitPrice = currentPosition.stopLoss; exited = true; }
                            else if (takeProfitPips > 0 && bar.l <= currentPosition.takeProfit) { pnl = (currentPosition.entryPrice - currentPosition.takeProfit) * lotMultiplier; exitPrice = currentPosition.takeProfit; exited = true; }
                        }
                        if (exited) { equity += pnl; tradeLog.push({ ...currentPosition, pnl, exitDate: bar.date, exitPrice }); currentPosition = null; barsSinceLastExit = 0; }
                    }

                    const todaysSignal = sortedSignals[signalIndex] && sortedSignals[signalIndex].date === bar.date.getTime() ? sortedSignals[signalIndex] : null;
                    if (todaysSignal) {
                         signalIndex++;
                        if (currentPosition && currentPosition.direction !== todaysSignal.direction) {
                            const pnl = (currentPosition.direction === 'BUY' ? (bar.c - currentPosition.entryPrice) : (currentPosition.entryPrice - bar.c)) * lotMultiplier;
                            equity += pnl;
                            tradeLog.push({ ...currentPosition, pnl, exitDate: bar.date, exitPrice: bar.c });
                            currentPosition = null;
                             barsSinceLastExit = 0;
                        }
                        if (!currentPosition && barsSinceLastExit >= tradeCooldown) {
                            const entryPrice = todaysSignal.direction === 'BUY' ? bar.c + spread : bar.c;
                            let sl = 0, tp = 0;
                            if (todaysSignal.direction === 'BUY') {
                                if (stopLossPips > 0) sl = entryPrice - stopLossPips * pipValue;
                                if (takeProfitPips > 0) tp = entryPrice + takeProfitPips * pipValue;
                            } else {
                                if (stopLossPips > 0) sl = entryPrice + stopLossPips * pipValue;
                                if (takeProfitPips > 0) tp = entryPrice - takeProfitPips * pipValue;
                            }
                            currentPosition = { lotSize, entryDate: bar.date, entryPrice, direction: todaysSignal.direction, stopLoss: sl, takeProfit: tp };
                        }
                    }
                    let floatingPnl = currentPosition ? (currentPosition.direction === 'BUY' ? (bar.c + spread - currentPosition.entryPrice) : (currentPosition.entryPrice - bar.c)) * lotMultiplier : 0;
                    const currentTotalEquity = equity + floatingPnl;
                    peakEquity = Math.max(peakEquity, currentTotalEquity);
                    equityData.push({x: bar.date.getTime(), y: currentTotalEquity});
                }
                return { tradeLog, equityData, peakEquity };
            }
            _calculatePerformanceStats(tradeLog, initialEquity, equityData) {
                const returns = tradeLog.map(t => t.pnl);
                const avgReturn = returns.length > 0 ? returns.reduce((a, b) => a + b, 0) / returns.length : 0;
                const stdDev = returns.length > 0 ? Math.sqrt(returns.map(x => Math.pow(x - avgReturn, 2)).reduce((a, b) => a + b, 0) / returns.length) : 0;
                const sharpeRatio = stdDev > 0 ? (avgReturn / stdDev) * Math.sqrt(252) : 0;
                const wins = tradeLog.filter(t => t.pnl > 0);
                const losses = tradeLog.filter(t => t.pnl <= 0);
                const totalGrossProfit = wins.reduce((sum, t) => sum + t.pnl, 0);
                const totalGrossLoss = losses.reduce((sum, t) => sum + t.pnl, 0);
                const avgWin = wins.length > 0 ? totalGrossProfit / wins.length : 0;
                const avgLoss = losses.length > 0 ? totalGrossLoss / losses.length : 0;
                let winStreak = 0, lossStreak = 0, maxWinStreak = 0, maxLossStreak = 0;
                tradeLog.forEach(trade => {
                    if (trade.pnl > 0) { winStreak++; lossStreak = 0; maxWinStreak = Math.max(maxWinStreak, winStreak); }
                    else { lossStreak++; winStreak = 0; maxLossStreak = Math.max(maxLossStreak, lossStreak); }
                });
                let peak = initialEquity, maxDrawdown = 0;
                equityData.forEach(e => { peak = Math.max(peak, e.y); const drawdown = (peak - e.y) / peak; if (drawdown > maxDrawdown) maxDrawdown = drawdown; });
                const finalEquity = equityData.length > 0 ? equityData[equityData.length - 1].y : initialEquity;
                return { pnl: finalEquity - initialEquity, winRate: tradeLog.length > 0 ? (wins.length / tradeLog.length) * 100 : 0, profitFactor: Math.abs(totalGrossLoss) > 0 ? totalGrossProfit / Math.abs(totalGrossLoss) : Infinity, maxDrawdown, sharpeRatio, avgWin, avgLoss, maxWinStreak, maxLossStreak, };
            }
            updateStats(stats) {
                document.getElementById('pnl').textContent = `${stats.pnl.toFixed(2)}`;
                document.getElementById('pnl').className = `stat-value font-bold ${stats.pnl >= 0 ? 'text-green-400' : 'text-red-400'}`;
                document.getElementById('winrate').textContent = `${stats.winRate.toFixed(2)}%`;
                document.getElementById('trades').textContent = stats.totalTrades;
                document.getElementById('profit-factor').textContent = stats.profitFactor === Infinity ? '∞' : stats.profitFactor.toFixed(2);
                document.getElementById('max-drawdown').textContent = `${(stats.maxDrawdown * 100).toFixed(2)}%`;
                document.getElementById('sharpe-ratio').textContent = stats.sharpeRatio.toFixed(2);
                document.getElementById('avg-win-loss').textContent = `${stats.avgWin.toFixed(2)} / ${Math.abs(stats.avgLoss).toFixed(2)}`;
            }
            populateTradeLog(tradeLog) {
                if (tradeLog.length === 0) { DOMElements.tradeLogContainer.innerHTML = '<p class="text-gray-500">No trades to display.</p>'; return; }
                const tableHeader = `<thead class="sticky top-0 bg-gray-800"><tr><th class="p-1 text-left">Direction</th><th class="p-1 text-left">Lots</th><th class="p-1 text-right">P/L ($)</th></tr></thead>`;
                const tableBody = [...tradeLog].reverse().map(trade => `
                    <tr class="border-t border-gray-700 hover:bg-gray-700/50">
                        <td class="p-1">${trade.direction} @ ${trade.entryPrice.toFixed(4)}</td>
                        <td class="p-1">${trade.lotSize}</td>
                        <td class="p-1 text-right ${trade.pnl >= 0 ? 'text-green-400' : 'text-red-400'}">${trade.pnl.toFixed(2)}</td>
                    </tr>`).join('');
                DOMElements.tradeLogContainer.innerHTML = `<table class="w-full">${tableHeader}<tbody>${tableBody}</tbody></table>`;
            }
        }
        document.addEventListener('DOMContentLoaded', () => { new ForexArchitect(); });
    </script>
</body>
